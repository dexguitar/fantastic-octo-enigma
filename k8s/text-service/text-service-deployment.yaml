apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-service
  namespace: document-processing
  labels:
    app: text-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: text-service
  template:
    metadata:
      labels:
        app: text-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.35
          command:
            [
              'sh',
              '-c',
              'until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done;',
            ]
      containers:
        - name: text-service
          image: document-processing-app:latest
          imagePullPolicy: Never
          command: ['npm', 'run', 'start:text']
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: SERVICE_COMMAND
              value: 'start:text'
            - name: KAFKA_CLIENT_ID
              value: 'document-processor-text'
            - name: KAFKA_GROUP_ID
              value: 'text-service-group'
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
