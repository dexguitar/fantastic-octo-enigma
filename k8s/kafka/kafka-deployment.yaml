apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: document-processing
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: wurstmeister/kafka:latest
          ports:
            - containerPort: 9092
              name: kafka
          env:
            - name: KAFKA_BROKER_ID
              value: '1'
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: 'zookeeper:2181'
            - name: KAFKA_ADVERTISED_HOST_NAME
              value: 'kafka'
            - name: KAFKA_ADVERTISED_PORT
              value: '9092'
            - name: KAFKA_PORT
              value: '9092'
            - name: KAFKA_CREATE_TOPICS
              value: 'document-image-processing:1:1,document-text-processing:1:1,document-processing-results:1:1'
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: 'true'
          volumeMounts:
            - name: kafka-data
              mountPath: /kafka
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data-pvc
